<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CrediListo · Acceso Móvil</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #020617;
            --surface: #0f172a;
            --surface2: #1e293b;
            --accent: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.25);
            --success: #22c55e;
            --text: #f8fafc;
            --muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 15% 15%, rgba(14,165,233,0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 85%, rgba(34,197,94,0.06) 0%, transparent 55%);
        }

        /* ── LOCK SCREEN ── */
        #lock-screen {
            position: fixed; inset: 0;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(14,165,233,0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(34,197,94,0.06) 0%, transparent 50%);
            padding: 1rem;
        }

        .lock-box {
            background: var(--surface);
            padding: 2.5rem 1.5rem;
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.07);
            text-align: center;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 40px var(--accent-glow);
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity:0; transform: translateY(20px); }
            to   { opacity:1; transform: translateY(0); }
        }

        .lock-logo { font-family: 'Syne', sans-serif; font-size: 2.2rem; font-weight: 800; margin-bottom: 0.3rem; }
        .lock-logo span { color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }
        .lock-sub { color: var(--muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 2rem; }

        .pin-dots {
            display: flex; gap: 0.75rem; justify-content: center; margin-bottom: 1.5rem;
        }
        .pin-dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid var(--muted);
            transition: all 0.2s;
        }
        .pin-dot.filled { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        .pin-field {
            position: absolute; opacity: 0; pointer-events: none;
        }

        .numpad {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem; margin-bottom: 1.5rem;
        }
        .num-btn {
            background: var(--surface2);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 1rem;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            padding: 1.2rem;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
            display: flex; align-items: center; justify-content: center;
        }
        .num-btn:active { transform: scale(0.92); background: rgba(14,165,233,0.15); border-color: var(--accent); }
        .num-btn.del { font-size: 1.2rem; color: var(--muted); }
        .num-btn.enter {
            background: var(--accent); color: var(--bg); border-color: var(--accent);
            font-size: 0.8rem; letter-spacing: 0.05em; font-family: 'Inter', sans-serif;
        }

        .pin-error {
            color: #f87171; font-size: 0.8rem; height: 1rem;
            transition: opacity 0.3s;
        }

        /* ── HUB MAIN ── */
        .hub-wrap {
            width: 100%; max-width: 480px; padding: 1.5rem;
            text-align: center; animation: fadeUp 0.5s ease both;
            display: flex; flex-direction: column; gap: 1.5rem;
        }

        .header-main { margin-bottom: 0.5rem; }
        .logo-main { font-family: 'Syne', sans-serif; font-size: 2.8rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
        .logo-main span { color: var(--accent); text-shadow: 0 0 30px var(--accent-glow); }
        .logo-sub { color: var(--muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.25em; margin-top: 0.5rem; }

        /* stats strip grid para movil */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.5rem;
            padding: 1.25rem;
        }
        .s-stat { display: flex; flex-direction: column; gap: 0.25rem; align-items: center; }
        .s-label { font-size: 0.55rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.15em; text-align: center;}
        .s-val { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 700; color: var(--accent); }
        .s-val.green { color: var(--success); }

        /* portal cards */
        .portal-list { display: flex; flex-direction: column; gap: 1.25rem; }

        .portal-card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
            text-decoration: none; color: inherit;
        }

        .portal-card::before {
            content: "";
            position: absolute; inset: 0;
            opacity: 0.5; transition: 0.4s;
        }
        .portal-card.mob::before { background: radial-gradient(circle at top, rgba(34,197,94,0.1) 0%, transparent 80%); }
        .portal-card.pc::before  { background: radial-gradient(circle at top, rgba(14,165,233,0.1) 0%, transparent 80%); }

        .portal-card:active { transform: scale(0.98); }
        .portal-card.mob { border-color: rgba(34,197,94,0.2); }
        .portal-card.pc  { border-color: rgba(14,165,233,0.2); }

        .icon-wrap {
            width: 64px; height: 64px;
            border-radius: 1.2rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; z-index: 1;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .portal-card.mob .icon-wrap { background: rgba(34,197,94,0.1); }
        .portal-card.pc  .icon-wrap { background: rgba(14,165,233,0.1); }

        .card-info { z-index: 1; }
        .card-info h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem; font-weight: 800; margin-bottom: 0.3rem;
        }
        .card-info p { color: var(--muted); font-size: 0.75rem; line-height: 1.4; }

        .btn-access {
            width: 100%; z-index: 1;
            padding: 0.9rem;
            border-radius: 1rem;
            font-weight: 800; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.05em;
            border: none;
        }
        .portal-card.mob .btn-access { background: var(--success); color: var(--bg); }
        .portal-card.pc  .btn-access { background: rgba(14,165,233,0.15); color: var(--accent); border: 1px solid rgba(14,165,233,0.3); }

        /* footer */
        .hub-footer {
            margin-top: 1rem;
            color: var(--muted); font-size: 0.6rem;
            text-transform: uppercase; letter-spacing: 0.15em;
            padding-bottom: 2rem;
        }
    </style>
</head>
<body>

    <!-- ── LOCK SCREEN ── -->
    <div id="lock-screen">
        <div class="lock-box">
            <div class="lock-logo">Credi<span>Listo</span></div>
            <div class="lock-sub">Acceso Móvil Seguro</div>

            <div class="pin-dots">
                <div class="pin-dot" id="d1"></div>
                <div class="pin-dot" id="d2"></div>
                <div class="pin-dot" id="d3"></div>
                <div class="pin-dot" id="d4"></div>
            </div>

            <input type="password" id="pin-hidden" class="pin-field" maxlength="4" autocomplete="off">

            <div class="numpad">
                <button class="num-btn" onclick="addDigit('1')">1</button>
                <button class="num-btn" onclick="addDigit('2')">2</button>
                <button class="num-btn" onclick="addDigit('3')">3</button>
                <button class="num-btn" onclick="addDigit('4')">4</button>
                <button class="num-btn" onclick="addDigit('5')">5</button>
                <button class="num-btn" onclick="addDigit('6')">6</button>
                <button class="num-btn" onclick="addDigit('7')">7</button>
                <button class="num-btn" onclick="addDigit('8')">8</button>
                <button class="num-btn" onclick="addDigit('9')">9</button>
                <button class="num-btn del" onclick="delDigit()">⌫</button>
                <button class="num-btn" onclick="addDigit('0')">0</button>
                <button class="num-btn enter" onclick="checkPin()">ENTRAR</button>
            </div>
            <div class="pin-error" id="pin-error"></div>
        </div>
    </div>

    <!-- ── HUB PRINCIPAL ── -->
    <div class="hub-wrap">
        <div class="header-main">
            <div class="logo-main">Credi<span>Listo</span></div>
            <div class="logo-sub">Gestión Móvil Integral</div>
        </div>

        <!-- Métricas globales en tiempo real -->
        <div class="stats-grid">
            <div class="s-stat">
                <span class="s-label">Capital</span>
                <span class="s-val" id="stat-cap">—</span>
            </div>
            <div class="s-stat">
                <span class="s-label">Cartera</span>
                <span class="s-val" id="stat-cart">—</span>
            </div>
            <div class="s-stat">
                <span class="s-label">Clientes</span>
                <span class="s-val green" id="stat-clis">—</span>
            </div>
            <div class="s-stat">
                <span class="s-label">Caja</span>
                <span class="s-val green" id="stat-caja">—</span>
            </div>
        </div>

        <!-- Selector de portal -->
        <div class="portal-list">
            <a class="portal-card mob" href="portalmovil.html">
                <div class="icon-wrap">📱</div>
                <div class="card-info">
                    <h2>PORTAL MÓVIL</h2>
                    <p>Cobros en campo, solicitudes y gestión rápida.</p>
                </div>
                <button class="btn-access">ENTRAR MÓVIL</button>
            </a>

            <a class="portal-card pc" href="portal.html">
                <div class="icon-wrap">🖥️</div>
                <div class="card-info">
                    <h2>VERSIÓN ESCRITORIO</h2>
                    <p>Reportes globales, caja y administración.</p>
                </div>
                <button class="btn-access">ENTRAR ESCRITORIO</button>
            </a>
        </div>

        <div class="hub-footer">CrediListo SaaS · Modo Móvil</div>
    </div>

    <script>
        /* ── Firebase ── */
        const DB_URL = "https://credilistosv-default-rtdb.firebaseio.com";
        const app = firebase.initializeApp({ databaseURL: DB_URL });
        const db  = app.database();

        /* ── PIN Logic ── */
        let pinBuffer = "";

        function addDigit(d) {
            if(pinBuffer.length >= 4) return;
            pinBuffer += d;
            updateDots();
            if(pinBuffer.length === 4) setTimeout(checkPin, 150);
        }

        function delDigit() {
            pinBuffer = pinBuffer.slice(0, -1);
            updateDots();
            document.getElementById('pin-error').textContent = "";
        }

        function updateDots() {
            for(let i = 1; i <= 4; i++) {
                document.getElementById('d'+i).classList.toggle('filled', i <= pinBuffer.length);
            }
        }

        function checkPin() {
            if(pinBuffer === "2025") {
                document.getElementById('lock-screen').style.display = 'none';
                sessionStorage.setItem('auth_credilisto_movil', 'true');
                loadGlobalStats();
            } else {
                document.getElementById('pin-error').textContent = "PIN incorrecto. Intente de nuevo.";
                pinBuffer = "";
                updateDots();
            }
        }

        // Auto-acceso si ya autenticado
        if(sessionStorage.getItem('auth_credilisto_movil') === 'true' || sessionStorage.getItem('auth_credilisto') === 'true') {
            document.getElementById('lock-screen').style.display = 'none';
            loadGlobalStats();
        }

        /* ── Stats globales ── */
        async function loadGlobalStats() {
            let totalCap = 0, totalCart = 0, totalCaja = 0, totalClis = 0;

            const branches = [
                { fin: 'config/finanzas',  cli: 'clientes'  },
                { fin: 'config/finanzas2', cli: 'clientes2' },
                { fin: 'config/finanzas3', cli: 'clientes3' },
            ];

            try {
                for(const b of branches) {
                    const [fSnap, cSnap] = await Promise.all([
                        db.ref(b.fin).once('value'),
                        db.ref(b.cli).once('value'),
                    ]);
                    const fin = fSnap.val() || {};
                    totalCap  += parseFloat(fin.capitalInvertido || 0);
                    totalCaja += parseFloat(fin.cajaChica || 0);

                    Object.values(cSnap.val() || {}).forEach(cl => {
                        if(cl.tipo === 'ACTIVO') {
                            totalCart += parseFloat(cl.saldo || 0);
                            totalClis++;
                        }
                    });
                }

                const fmt = n => '$' + parseFloat(n).toLocaleString('es-SV', {minimumFractionDigits: 2});
                document.getElementById('stat-cap').textContent  = fmt(totalCap);
                document.getElementById('stat-cart').textContent = fmt(totalCart);
                document.getElementById('stat-caja').textContent = fmt(totalCaja);
                document.getElementById('stat-clis').textContent = totalClis;
            } catch (error) {
                console.error("Error loading stats:", error);
            }
        }
    </script>
</body>
</html>
